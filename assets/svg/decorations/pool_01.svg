<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-labelledby="pwTitle pwDesc">
  <title id="pwTitle">Kolam Hias Resort</title>
  <desc id="pwDesc">Kolam renang infinity berwarna turquoise dengan dek batu, kursi santai, payung, dan pohon palem. Digambar isometrik 2:1.</desc>
  <defs>
    <linearGradient id="pwDeckA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8cdb6"/>
      <stop offset=".55" stop-color="#f4edde"/>
      <stop offset="1" stop-color="#fffaf1"/>
    </linearGradient>
    <linearGradient id="pwDeckB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset=".5" stop-color="#ece3d1"/>
      <stop offset="1" stop-color="#cbbfa6"/>
    </linearGradient>
    <linearGradient id="pwWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8fbff"/>
      <stop offset=".35" stop-color="#5fdbe8"/>
      <stop offset=".8" stop-color="#1fa6c7"/>
      <stop offset="1" stop-color="#0d7096"/>
    </linearGradient>
    <linearGradient id="pwWaterDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#45cadd"/>
      <stop offset="1" stop-color="#0a5f83"/>
    </linearGradient>
    <linearGradient id="pwTrunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e3c1c"/>
      <stop offset=".6" stop-color="#a06c36"/>
      <stop offset="1" stop-color="#d6a867"/>
    </linearGradient>
    <linearGradient id="pwFrondA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86dd67"/>
      <stop offset="1" stop-color="#2f8f43"/>
    </linearGradient>
    <linearGradient id="pwFrondB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#65c95a"/>
      <stop offset="1" stop-color="#1f7237"/>
    </linearGradient>
    <linearGradient id="pwCushion" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc37a"/>
      <stop offset="1" stop-color="#e98d3d"/>
    </linearGradient>
    <radialGradient id="pwShadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#173b2c" stop-opacity=".3"/>
      <stop offset="1" stop-color="#173b2c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pwGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d8fdff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#77e9f4" stop-opacity="0"/>
    </radialGradient>
    <g id="pwPalm">
