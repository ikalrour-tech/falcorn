    <polygon points="80,104 134,129 80,153 26,129" fill="url(#pwDeckA)"/>
    <path d="M26 129L80 153L134 129" fill="none" stroke="#c2b79d" stroke-width="1"/>
    <path d="M40 121L84 100M56 131L106 105M68 140L128 110" stroke="#ddd3bf" stroke-width=".7" opacity=".8"/>
    <path d="M120 121L76 100M104 131L54 105M92 140L32 110" stroke="#ddd3bf" stroke-width=".7" opacity=".8"/>
  </g>

  <g id="pool" stroke="#223247" stroke-width="1.4" stroke-linejoin="round">
