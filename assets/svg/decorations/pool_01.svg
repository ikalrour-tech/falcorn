      <g stroke="#223247" stroke-width=".6">
        <path d="M-1 -30C-12 -40 -22 -40 -28 -34C-16 -36 -8 -32 -2 -28Z" fill="url(#pwFrondB)"/>
        <path d="M-1 -30C-8 -44 -18 -48 -26 -46C-15 -42 -7 -35 -1 -29Z" fill="url(#pwFrondA)"/>
        <path d="M-1 -30C2 -44 0 -52 -5 -56C-5 -46 -3 -36 0 -28Z" fill="url(#pwFrondB)"/>
        <path d="M-1 -30C10 -42 20 -44 27 -39C16 -36 7 -31 1 -28Z" fill="url(#pwFrondA)"/>
        <path d="M-1 -30C12 -32 23 -28 28 -21C16 -25 7 -26 0 -28Z" fill="url(#pwFrondB)"/>
      </g>
      <circle cx="-2" cy="-28" r="1.8" fill="#c9932f" stroke="#223247" stroke-width=".5"/>
      <circle cx="2" cy="-27" r="1.5" fill="#b07d26" stroke="#223247" stroke-width=".5"/>
    </g>
  </defs>

  <ellipse cx="82" cy="145" rx="58" ry="15" fill="url(#pwShadow)"/>

