<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-labelledby="ftTitle ftDesc">
  <title id="ftTitle">Air Mancur Megah</title>
  <desc id="ftDesc">Air mancur tiga tingkat dengan marmer putih, aksen emas, dan pancuran air biru. Digambar isometrik 2:1.</desc>
  <defs>
    <linearGradient id="ftStoneA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfc3aa"/>
      <stop offset=".55" stop-color="#f3ead6"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <linearGradient id="ftStoneB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".5" stop-color="#ece1c9"/>
      <stop offset="1" stop-color="#c8ba9c"/>
    </linearGradient>
    <linearGradient id="ftWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdf8ff"/>
      <stop offset=".45" stop-color="#49c4dd"/>
      <stop offset="1" stop-color="#197fa6"/>
    </linearGradient>
    <linearGradient id="ftWaterDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe6f2"/>
      <stop offset="1" stop-color="#117397"/>
    </linearGradient>
    <linearGradient id="ftGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3b8"/>
      <stop offset=".5" stop-color="#e9c46a"/>
      <stop offset="1" stop-color="#b07d26"/>
    </linearGradient>
    <radialGradient id="ftShadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#173b2c" stop-opacity=".3"/>
      <stop offset="1" stop-color="#173b2c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ftGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e9ffff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#8ceeff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="82" cy="145" rx="55" ry="16" fill="url(#ftShadow)"/>

  <g id="pool" stroke="#223247" stroke-width="1.3" stroke-linejoin="round">
    <polygon points="80,101 137,129 80,157 23,129" fill="url(#ftStoneB)"/>
    <polygon points="80,105 132,129 80,153 28,129" fill="url(#ftStoneA)"/>
    <polygon points="80,108 129,129 80,150 31,129" fill="#d9cbaa"/>
    <polygon points="80,111 125,129 80,147 35,129" fill="url(#ftWater)"/>
    <polygon points="80,115 120,129 80,143 40,129" fill="url(#ftWaterDeep)" opacity=".55"/>
    <g fill="none" stroke="#e9ffff" stroke-width=".9" opacity=".7">
      <ellipse cx="80" cy="130" rx="30" ry="14"/>
      <ellipse cx="80" cy="132" rx="21" ry="9.5"/>
      <ellipse cx="80" cy="134" rx="12" ry="5.5"/>
    </g>
    <path d="M23 129L80 157L137 129" fill="none" stroke="#f7f0dd" stroke-width="1.6"/>
    <path d="M26 134L80 159L134 134" fill="none" stroke="#bdae8d" stroke-width="1" opacity=".7"/>
    <g fill="#f7e7bd" stroke="#223247" stroke-width=".6">
      <polygon points="47,124 51,126 51,130 47,128"/>
      <polygon points="109,124 113,126 113,130 109,128"/>
      <polygon points="70,145 74,147 74,151 70,149"/>
      <polygon points="88,145 92,147 92,151 88,149"/>
    </g>
  </g>

  <g id="fountain-body" stroke="#223247" stroke-width="1.1" stroke-linejoin="round">
    <polygon points="80,120 92,126 80,132 68,126" fill="url(#ftStoneA)"/>
    <polygon points="68,126 80,132 80,142 68,136" fill="url(#ftStoneA)"/>
    <polygon points="80,132 92,126 92,136 80,142" fill="url(#ftStoneB)"/>
    <ellipse cx="80" cy="119" rx="28" ry="11" fill="url(#ftStoneB)"/>
    <ellipse cx="80" cy="118" rx="24" ry="9" fill="url(#ftWater)"/>
    <ellipse cx="80" cy="118" rx="24" ry="9" fill="none" stroke="url(#ftGold)" stroke-width="1.3"/>
    <ellipse cx="80" cy="117" rx="16" ry="5.5" fill="#d7fbff" opacity=".55"/>

    <polygon points="76,106 84,110 80,113 72,109" fill="url(#ftStoneA)"/>
    <polygon points="72,108 80,112 80,121 72,117" fill="url(#ftStoneA)"/>
    <polygon points="80,112 84,110 84,119 80,121" fill="url(#ftStoneB)"/>
    <ellipse cx="80" cy="105" rx="18" ry="7" fill="url(#ftStoneB)"/>
    <ellipse cx="80" cy="104" rx="15" ry="5.5" fill="url(#ftWater)"/>
    <ellipse cx="80" cy="104" rx="15" ry="5.5" fill="none" stroke="url(#ftGold)" stroke-width="1.1"/>
    <ellipse cx="80" cy="103.5" rx="9" ry="3" fill="#e2fcff" opacity=".6"/>

    <polygon points="77,96 83,99 80,101 74,98" fill="url(#ftStoneA)"/>
    <polygon points="74,98 80,101 80,111 74,108" fill="url(#ftStoneA)"/>
    <polygon points="80,101 83,99 83,109 80,111" fill="url(#ftStoneB)"/>
    <ellipse cx="80" cy="95" rx="11" ry="4.4" fill="url(#ftStoneB)"/>
    <ellipse cx="80" cy="94.5" rx="9" ry="3.4" fill="url(#ftWater)"/>
    <ellipse cx="80" cy="94.5" rx="9" ry="3.4" fill="none" stroke="url(#ftGold)" stroke-width="1"/>

    <polygon points="78,88 82,90 80,92 76,90" fill="url(#ftStoneA)"/>
    <ellipse cx="80" cy="86" rx="5" ry="2.1" fill="url(#ftStoneB)"/>
    <ellipse cx="80" cy="85.5" rx="3.8" ry="1.5" fill="url(#ftWater)"/>
    <path d="M80 84V78" stroke="#b07d26" stroke-width="1.4"/>
    <circle cx="80" cy="76.5" r="2" fill="url(#ftGold)" stroke="#8a641d" stroke-width=".5"/>
  </g>

  <g id="water-jets" fill="none" stroke-linecap="round">
    <path d="M80 78C76 84 74 90 76 94" stroke="#d7fbff" stroke-width="1.2" opacity=".85"/>
    <path d="M80 78C84 84 86 90 84 94" stroke="#d7fbff" stroke-width="1.2" opacity=".85"/>
    <path d="M80 76C80 83 80 88 80 94" stroke="#eaffff" stroke-width="1.5" opacity=".9"/>
    <path d="M80 96C74 100 70 104 68 108" stroke="#c9f9ff" stroke-width="1" opacity=".8"/>
    <path d="M80 96C86 100 90 104 92 108" stroke="#c9f9ff" stroke-width="1" opacity=".8"/>
    <path d="M80 106C72 111 66 114 62 118" stroke="#bff5ff" stroke-width="1" opacity=".75"/>
    <path d="M80 106C88 111 94 114 98 118" stroke="#bff5ff" stroke-width="1" opacity=".75"/>
    <path d="M80 106C80 112 80 116 80 121" stroke="#eaffff" stroke-width=".9" opacity=".65"/>
    <path d="M80 120C68 124 58 126 50 127" stroke="#bff5ff" stroke-width=".9" opacity=".6"/>
    <path d="M80 120C92 124 102 126 110 127" stroke="#bff5ff" stroke-width=".9" opacity=".6"/>
  </g>
  <g fill="#eaffff" opacity=".9">
    <circle cx="72" cy="92" r="1.3"/>
    <circle cx="88" cy="92" r="1.3"/>
    <circle cx="76" cy="86" r="1"/>
    <circle cx="84" cy="86" r="1"/>
    <circle cx="65" cy="112" r="1.1"/>
    <circle cx="95" cy="112" r="1.1"/>
    <circle cx="57" cy="123" r="1"/>
    <circle cx="103" cy="123" r="1"/>
  </g>
  <ellipse cx="80" cy="82" rx="14" ry="10" fill="url(#ftGlow)" opacity=".5"/>
</svg>
