<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240" width="160" height="240" role="img" aria-labelledby="mlTitle mlDesc">
  <title id="mlTitle">Nusantara Mall — pusat perbelanjaan modern</title>
  <desc id="mlDesc">Mal lebar dengan atap kerang putih, atrium kaca, fasad toko, papan emas, air mancur, dan pohon palem. Digambar isometrik 2:1.</desc>

  <defs>
    <linearGradient id="mlStoneLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cdc3ae"/>
      <stop offset="1" stop-color="#f2ead8"/>
    </linearGradient>
    <linearGradient id="mlStoneRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffbf1"/>
      <stop offset="1" stop-color="#e2d7c2"/>
    </linearGradient>
    <linearGradient id="mlGlassLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e5878"/>
      <stop offset=".6" stop-color="#2b96b3"/>
      <stop offset="1" stop-color="#74dce7"/>
    </linearGradient>
    <linearGradient id="mlGlassRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a6f6fb"/>
      <stop offset=".5" stop-color="#4ac7da"/>
      <stop offset="1" stop-color="#11738f"/>
    </linearGradient>
    <linearGradient id="mlRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f3ead7"/>
      <stop offset="1" stop-color="#d9c9a9"/>
    </linearGradient>
    <linearGradient id="mlGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2b6"/>
      <stop offset=".5" stop-color="#e9c46a"/>
      <stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
    <linearGradient id="mlWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6f8ff"/>
      <stop offset="1" stop-color="#2288ae"/>
    </linearGradient>
    <radialGradient id="mlShadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#18332a" stop-opacity=".3"/>
      <stop offset="1" stop-color="#18332a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mlFloorsLeft" width="10" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 0L10 5" stroke="#d9fbff" stroke-width=".7" opacity=".45"/>
    </pattern>
    <pattern id="mlFloorsRight" width="10" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 5L10 0" stroke="#f4ffff" stroke-width=".7" opacity=".5"/>
    </pattern>
    <clipPath id="mlShopFront"><polygon points="34,192 80,215 80,194 34,171"/></clipPath>
    <g id="mlPalm">
      <path d="M0 0C-2 -8 -1 -16 0 -24" fill="none" stroke="#8a5a2b" stroke-width="2.6" stroke-linecap="round"/>
      <g stroke="#223247" stroke-width=".65">
        <path d="M0 -24C-12 -32 -20 -28 -25 -22C-14 -25 -7 -22 0 -21Z" fill="#3f9b4f"/>
        <path d="M0 -24C-10 -36 -18 -38 -24 -36C-13 -33 -7 -27 0 -22Z" fill="#57b765"/>
        <path d="M0 -24C10 -36 18 -37 24 -34C13 -31 7 -26 0 -22Z" fill="#3f9b4f"/>
        <path d="M0 -24C12 -28 20 -26 25 -20C14 -22 7 -21 0 -21Z" fill="#4daa5b"/>
        <path d="M0 -24C2 -34 0 -40 -3 -45C-5 -36 -4 -29 0 -22Z" fill="#57b765"/>
      </g>
      <circle cx="0" cy="-24" r="2" fill="#c9a227" stroke="#223247" stroke-width=".6"/>
    </g>
  </defs>

  <g id="shadow">
    <ellipse cx="84" cy="218" rx="64" ry="22" fill="url(#mlShadow)"/>
    <path d="M80 190L148 220L80 239L12 209Z" fill="#173b2c" opacity=".1"/>
  </g>

  <g id="plaza">
    <path d="M80 181L135 208L80 235L25 208Z" fill="#efe7d3" stroke="#c9bda0" stroke-width="1.2"/>
    <path d="M80 187L128 208L80 230L32 208Z" fill="none" stroke="#d8c79c" stroke-width="1.3" stroke-dasharray="4 4"/>
    <path d="M80 195L113 208L80 222L47 208Z" fill="#faf4e5" stroke="#c9bda0" stroke-width="1"/>
    <ellipse cx="112" cy="223" rx="15" ry="7" fill="url(#mlWater)" stroke="#223247" stroke-width="1.2"/>
    <ellipse cx="112" cy="221" rx="11" ry="4.5" fill="#cff9ff" opacity=".7"/>
    <path d="M112 220C109 214 112 208 116 205C116 212 115 216 112 220Z" fill="#e0fdff" opacity=".9"/>
    <use href="#mlPalm" transform="translate(26 211) scale(.95)"/>
    <use href="#mlPalm" transform="translate(134 204) scale(.85)"/>
    <use href="#mlPalm" transform="translate(20 219) scale(.6)"/>
    <path d="M60 220L72 214L79 217L67 223Z" fill="#8fd06a" opacity=".8"/>
    <path d="M93 228L103 223L109 226L99 231Z" fill="#7fc369" opacity=".75"/>
  </g>

  <g id="mall-body" stroke="#223247" stroke-width="1.8" stroke-linejoin="round">
    <polygon points="26,190 80,217 80,232 26,205" fill="url(#mlStoneLeft)"/>
    <polygon points="80,217 134,190 134,205 80,232" fill="url(#mlStoneRight)"/>
    <polygon points="80,163 134,190 80,217 26,190" fill="#fffaf0"/>

    <polygon points="32,190 80,214 80,198 32,174" fill="url(#mlGlassLeft)"/>
    <polygon points="80,214 128,190 128,174 80,198" fill="url(#mlGlassRight)"/>
    <polygon points="32,190 80,214 80,198 32,174" fill="url(#mlFloorsLeft)"/>
    <polygon points="80,214 128,190 128,174 80,198" fill="url(#mlFloorsRight)"/>

    <g clip-path="url(#mlShopFront)" stroke="#f3feff" stroke-width=".8" opacity=".4">
      <path d="M40 186V220M50 186V220M60 186V220M70 186V220M90 186V220M100 186V220M110 186V220M120 186V220"/>
    </g>
    <path d="M32 190L80 214L128 190" fill="none" stroke="url(#mlGold)" stroke-width="2.4"/>
    <path d="M32 174L80 198L128 174" fill="none" stroke="#fffaf0" stroke-width="1.6"/>

    <path d="M76 206L94 197L94 214L76 223Z" fill="#123f5b"/>
    <path d="M76 206L94 197L94 214L76 223Z" fill="none" stroke="#f0d27a" stroke-width="1.5"/>
    <path d="M70 202L100 186L105 190L75 206Z" fill="url(#mlGold)" stroke="#8a641d" stroke-width="1"/>
    <path d="M84 205L94 200L94 213L84 218Z" fill="#5ddfee" opacity=".7"/>
    <path d="M40 199L52 193L52 202L40 208Z" fill="#ffd76a" opacity=".8" stroke="#8a641d" stroke-width=".6"/>
    <path d="M58 208L68 203L68 211L58 216Z" fill="#7fe7f4" opacity=".75" stroke="#223247" stroke-width=".6"/>
    <path d="M104 195L118 188L118 197L104 204Z" fill="#7fe7f4" opacity=".85" stroke="#223247" stroke-width=".6"/>
    <path d="M122 189L131 184L131 187L122 192Z" fill="#f4a261" opacity=".8"/>
  </g>

  <g id="mall-roof">
    <path d="M24 184C40 174 62 162 80 152C98 162 120 174 136 184C120 196 98 207 80 218C62 207 40 196 24 184Z"
          fill="url(#mlRoof)" stroke="#223247" stroke-width="2" stroke-linejoin="round"/>
    <path d="M24 184C40 174 62 162 80 152C98 162 120 174 136 184" fill="none" stroke="url(#mlGold)" stroke-width="2.2"/>
    <path d="M24 184C42 186 61 196 80 218C99 196 118 186 136 184" fill="none" stroke="#b9a57d" stroke-width="1.2" opacity=".7"/>
    <path d="M42 178C56 168 70 160 80 154C90 160 104 168 118 178" fill="none" stroke="#d8c9aa" stroke-width="1.1" opacity=".8"/>
    <path d="M55 184C65 176 74 169 80 165C86 169 95 176 105 184" fill="none" stroke="#e9c46a" stroke-width="1" opacity=".8"/>
    <path d="M56 191C64 185 73 179 80 175C87 179 96 185 104 191L80 204Z" fill="#8feaf5" opacity=".45"/>
    <g stroke="#ffffff" stroke-width=".8" opacity=".5">
      <path d="M68 172L80 164L92 172M60 180L80 168L100 180M50 189L80 174L110 189"/>
    </g>

    <path d="M66 186C66 168 94 168 94 186" fill="#8beff8" opacity=".65" stroke="#223247" stroke-width="1.2"/>
    <ellipse cx="80" cy="186" rx="14" ry="6" fill="#bffaff" stroke="#223247" stroke-width="1.2"/>
    <path d="M80 170V160" stroke="#b8862f" stroke-width="1.4"/>
    <circle cx="80" cy="158" r="2" fill="#ffe9a1" stroke="#b8862f" stroke-width=".7"/>

    <path d="M118 188L128 182L128 188L118 194Z" fill="#e9c46a" stroke="#223247" stroke-width=".9"/>
    <path d="M122 187L126 185L126 188L122 190Z" fill="#fff8dd"/>
    <path d="M32 188L42 182L42 188L32 194Z" fill="#e9c46a" stroke="#223247" stroke-width=".9"/>
    <path d="M36 187L40 185L40 188L36 190Z" fill="#fff8dd"/>
  </g>

  <g id="mall-sign">
    <path d="M128 173V148" stroke="#223247" stroke-width="1.4"/>
    <path d="M120 148L136 148L132 140L124 140Z" fill="url(#mlGold)" stroke="#223247" stroke-width="1"/>
    <path d="M127 146L129 143L131 146L129 149Z" fill="#fff8dd"/>
    <path d="M118 172L124 169L124 172L118 175Z" fill="#4daa5b" stroke="#223247" stroke-width=".6"/>
  </g>

  <g id="mall-glints" fill="#ffffff" opacity=".6">
    <rect x="47" y="184" width="6" height="2" transform="rotate(27 47 184)"/>
    <rect x="92" y="200" width="5" height="2" transform="rotate(-27 92 200)"/>
    <rect x="70" y="193" width="4" height="2" transform="rotate(27 70 193)"/>
  </g>
</svg>
