      <stop offset="0" stop-color="#c7d2da"/>
      <stop offset=".6" stop-color="#eef3f6"/>
      <stop offset="1" stop-color="#fbfdfe"/>
    </linearGradient>
    <linearGradient id="hsStoneRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#e8eef2"/>
      <stop offset="1" stop-color="#c3ced6"/>
    </linearGradient>
    <linearGradient id="hsStoneTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eff3"/>
    </linearGradient>
    <linearGradient id="hsGlassLeft" x1="0" y1="0" x2="1" y2="0">
