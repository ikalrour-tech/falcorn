    <linearGradient id="hsWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdf8ff"/>
      <stop offset=".55" stop-color="#4cc6df"/>
      <stop offset="1" stop-color="#1b7fa6"/>
