<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240" width="160" height="240" role="img" aria-labelledby="hsTitle hsDesc">
  <title id="hsTitle">Rumah Sakit Modern — menara putih dengan pita kaca biru</title>
  <desc id="hsDesc">Rumah sakit modern dengan menara putih berpita kaca biru, tanda palang merah, helipad, kanopi ambulans, taman, dan pohon palem. Digambar isometrik 2:1.</desc>

