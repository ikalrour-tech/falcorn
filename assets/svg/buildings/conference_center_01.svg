  <g id="conference-banners">
    <path d="M118 181V158" stroke="#223247" stroke-width="1.3"/>
    <path d="M118 158L128 161L118 165Z" fill="#2a9d8f" stroke="#223247" stroke-width=".6"/>
    <path d="M118 162L128 165L118 169Z" fill="#7fe7f4" stroke="#223247" stroke-width=".6"/>
    <path d="M42 182V159" stroke="#223247" stroke-width="1.3"/>
    <path d="M42 159L52 162L42 166Z" fill="#e63946" stroke="#223247" stroke-width=".6"/>
    <path d="M42 163L52 166L42 170Z" fill="#fff" stroke="#223247" stroke-width=".6"/>
