    <linearGradient id="ccGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2b2"/>
      <stop offset=".5" stop-color="#e9c46a"/>
      <stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
    <linearGradient id="ccWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6f8ff"/>
      <stop offset="1" stop-color="#2288ae"/>
