    <path d="M44 163C56 138 70 122 82 112C76 136 74 154 76 174C66 166 55 163 44 163Z" fill="#8beff8" opacity=".45"/>

    <path d="M66 154C78 112 102 88 118 82C108 116 106 146 110 178C96 164 81 157 66 154Z" fill="url(#ccShellShade)" stroke="#223247" stroke-width="1.8"/>
    <path d="M66 154C78 112 102 88 118 82" fill="none" stroke="url(#ccGold)" stroke-width="2.2"/>
    <path d="M76 151C86 122 99 105 110 95C104 122 103 146 106 166C96 156 86 152 76 151Z" fill="#8beff8" opacity=".4"/>

    <path d="M100 160C108 132 124 114 136 108C130 134 128 156 130 180C120 168 110 163 100 160Z" fill="url(#ccShell)" stroke="#223247" stroke-width="1.8"/>
    <path d="M100 160C108 132 124 114 136 108" fill="none" stroke="url(#ccGold)" stroke-width="2"/>
    <path d="M108 158C114 138 124 124 130 118C126 138 125 154 126 169C119 163 113 160 108 158Z" fill="#8beff8" opacity=".4"/>

