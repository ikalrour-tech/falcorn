<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240" width="160" height="240" role="img" aria-labelledby="ccTitle ccDesc">
  <title id="ccTitle">Pusat Konferensi Nusantara</title>
  <desc id="ccDesc">Pusat konferensi dengan tiga atap kerang putih, dinding kaca, pintu lengkung emas, bendera, air mancur, dan pohon palem.</desc>

  <defs>
    <linearGradient id="ccShell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#f4ecdc"/>
      <stop offset="1" stop-color="#d8c9ab"/>
    </linearGradient>
    <linearGradient id="ccShellShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7dcc7"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <linearGradient id="ccGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b4d6c"/>
      <stop offset=".55" stop-color="#1f8daa"/>
      <stop offset="1" stop-color="#74dfe9"/>
    </linearGradient>
    <linearGradient id="ccGlass2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9af4fb"/>
      <stop offset=".5" stop-color="#3bc1d5"/>
      <stop offset="1" stop-color="#0e6d8c"/>
    </linearGradient>
    <linearGradient id="ccStoneLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cdc4b2"/>
      <stop offset="1" stop-color="#f1e9da"/>
