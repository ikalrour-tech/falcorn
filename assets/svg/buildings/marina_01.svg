<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-labelledby="maTitle maDesc">
  <title id="maTitle">Marina Nusantara — dermaga yacht modern</title>
  <desc id="maDesc">Marina modern dengan dermaga terapung putih, yacht layar, kapal motor, klub kaca, pohon palem, lampu emas, dan air laut biru.</desc>

