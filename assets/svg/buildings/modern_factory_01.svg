    <linearGradient id="mfGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2b2"/>
      <stop offset=".5" stop-color="#e9c46a"/>
      <stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
    <radialGradient id="mfShadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#18332a" stop-opacity=".28"/>
      <stop offset="1" stop-color="#18332a" stop-opacity="0"/>
    </radialGradient>
