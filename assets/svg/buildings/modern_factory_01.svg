<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240" width="160" height="240" role="img" aria-labelledby="mfTitle mfDesc">
  <title id="mfTitle">Pabrik Modern Nusantara</title>
  <desc id="mfDesc">Pabrik modern berjendela kaca dengan atap panel surya, cerobong bersih, kantor kecil, halaman truk, dan pohon palem.</desc>

  <defs>
    <linearGradient id="mfWallLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9c1cc"/>
      <stop offset="1" stop-color="#e8edf3"/>
    </linearGradient>
    <linearGradient id="mfWallRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f8fb"/>
      <stop offset="1" stop-color="#cdd5df"/>
    </linearGradient>
    <linearGradient id="mfGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e5878"/>
      <stop offset=".55" stop-color="#2b96b3"/>
      <stop offset="1" stop-color="#82e0ea"/>
    </linearGradient>
    <linearGradient id="mfRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7dee6"/>
