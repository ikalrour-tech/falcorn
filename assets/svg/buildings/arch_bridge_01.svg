<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-labelledby="brTitle brDesc">
  <title id="brTitle">Jembatan Aurora — jembatan lengkung futuristik</title>
  <desc id="brDesc">Jembatan lengkung futuristik dengan dua rusuk lengkung putih-emas, lampu cyan, dek kaca, kendaraan listrik, dan air laut biru.</desc>

  <defs>
    <linearGradient id="brWater" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fd2e6"/>
      <stop offset=".55" stop-color="#39a8cb"/>
      <stop offset="1" stop-color="#227fae"/>
    </linearGradient>
    <linearGradient id="brDeck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f1f3f2"/>
      <stop offset="1" stop-color="#cbd3d6"/>
    </linearGradient>
    <linearGradient id="brSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#73859a"/>
      <stop offset="1" stop-color="#3c4e64"/>
    </linearGradient>
    <linearGradient id="brArch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#fff7e5"/>
      <stop offset="1" stop-color="#d9cfbd"/>
    </linearGradient>
    <linearGradient id="brGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2b2"/>
      <stop offset=".5" stop-color="#e9c46a"/>
      <stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
    <linearGradient id="brGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b4c69"/>
      <stop offset=".55" stop-color="#22a1bb"/>
      <stop offset="1" stop-color="#8ceff5"/>
    </linearGradient>
    <radialGradient id="brShade" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#123e50" stop-opacity=".3"/>
      <stop offset="1" stop-color="#123e50" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="brWaterClip"><path d="M80 109L142 140L80 171L18 140Z"/></clipPath>
  </defs>

  <g id="water">
    <path d="M80 109L142 140L80 171L18 140Z" fill="url(#brWater)" stroke="#217394" stroke-width="1.4"/>
    <g clip-path="url(#brWaterClip)">
      <path d="M22 141C34 133 44 143 55 137M48 156C60 148 70 158 82 152M98 133C108 126 116 134 128 127M70 164C82 157 92 166 104 160" fill="none" stroke="#d4fbfd" stroke-width="1.2" opacity=".55"/>
      <path d="M28 148C40 142 52 151 66 145M84 164C96 158 108 166 124 158" fill="none" stroke="#ffffff" stroke-width=".8" opacity=".35"/>
      <ellipse cx="82" cy="152" rx="30" ry="8" fill="url(#brShade)"/>
    </g>
  </g>

  <g id="piers">
    <path d="M67 148L72 146L73 168L68 170Z" fill="#e8ecec" stroke="#223247" stroke-width="1.1"/>
    <path d="M72 146L76 148L77 169L73 168Z" fill="#aab7c1" stroke="#223247" stroke-width="1"/>
    <path d="M68 164L77 164" stroke="url(#brGold)" stroke-width="2"/>
    <path d="M94 160L99 158L100 174L95 176Z" fill="#e8ecec" stroke="#223247" stroke-width="1.1"/>
    <path d="M99 158L103 160L104 175L100 174Z" fill="#aab7c1" stroke="#223247" stroke-width="1"/>
    <path d="M95 171L104 171" stroke="url(#brGold)" stroke-width="1.8"/>
  </g>

  <g id="bridge-deck">
    <polygon points="41,138.5 103,169.5 103,174.5 41,143.5" fill="url(#brSide)" stroke="#223247" stroke-width="1.2"/>
    <polygon points="103,169.5 119,161.5 119,166.5 103,174.5" fill="#55677b" stroke="#223247" stroke-width="1.2"/>
    <polygon points="57,130.5 41,138.5 41,143.5 57,135.5" fill="#8d9dad" stroke="#223247" stroke-width="1.1"/>
    <polygon points="57,130.5 119,161.5 103,169.5 41,138.5" fill="url(#brDeck)" stroke="#223247" stroke-width="1.5"/>

    <path d="M49 134.5L111 165.5" stroke="#d8b95c" stroke-width="1.8" stroke-dasharray="6 5"/>
    <path d="M44 140L106 171" stroke="#ffffff" stroke-width="1" opacity=".75"/>
    <path d="M54 130L116 161" stroke="#ffffff" stroke-width="1" opacity=".75"/>

    <g id="glass-rails">
      <polygon points="57,130.5 119,161.5 117,162.5 55,131.5" fill="#9af1f7" opacity=".5"/>
      <polygon points="41,138.5 103,169.5 101,170.5 39,139.5" fill="#9af1f7" opacity=".5"/>
      <path d="M57 130.5L119 161.5" stroke="#e9fdff" stroke-width="1"/>
      <path d="M41 138.5L103 169.5" stroke="#e9fdff" stroke-width="1"/>
      <g stroke="#f2ffff" stroke-width=".7">
        <path d="M61 132.5V131M70 137V135.5M79 141.5V140M88 146V144.5M97 150.5V149M106 155V153.5M115 159.5V158"/>
        <path d="M45 140.5V139M54 145V143.5M63 149.5V148M72 154V152.5M81 158.5V157M90 163V161.5M99 167.5V166"/>
      </g>
      <path d="M62 131.8L72 136.8M78 139.8L88 144.8M94 147.8L104 152.8M110 155.8L118 159.8" stroke="#58e7f2" stroke-width="1.4" opacity=".9"/>
      <path d="M46 139.8L56 144.8M62 147.8L72 152.8M78 155.8L88 160.8M94 163.8L101 167.3" stroke="#58e7f2" stroke-width="1.4" opacity=".9"/>
    </g>

    <g id="deck-lights">
      <circle cx="49" cy="134.5" r="1.6" fill="#ffe9a1" stroke="#8a641d" stroke-width=".5"/>
      <circle cx="80" cy="150" r="1.6" fill="#ffe9a1" stroke="#8a641d" stroke-width=".5"/>
      <circle cx="111" cy="165.5" r="1.6" fill="#ffe9a1" stroke="#8a641d" stroke-width=".5"/>
      <path d="M60 136L60 164" stroke="#5de6f2" stroke-width=".6" opacity=".45"/>
    </g>
  </g>

  <g id="arches" fill="none" stroke-linecap="round">
    <path d="M57 130.5C66 76 100 48 119 161.5" stroke="#223247" stroke-width="5.5"/>
    <path d="M57 130.5C66 76 100 48 119 161.5" stroke="url(#brArch)" stroke-width="3.2"/>
    <path d="M57 130.5C66 76 100 48 119 161.5" stroke="url(#brGold)" stroke-width="1.1" opacity=".9"/>
    <path d="M41 138.5C50 84 84 56 103 169.5" stroke="#223247" stroke-width="5.5"/>
    <path d="M41 138.5C50 84 84 56 103 169.5" stroke="url(#brArch)" stroke-width="3.2"/>
    <path d="M41 138.5C50 84 84 56 103 169.5" stroke="url(#brGold)" stroke-width="1.1" opacity=".9"/>

    <g id="arch-braces" stroke-width="1.4">
      <path d="M67 95L53 103M88 72L74 80M105 110L91 118M118 137L104 145" stroke="#e9c46a" opacity=".9"/>
      <circle cx="67" cy="95" r="1.3" fill="#fff2b2" stroke="#b8862f" stroke-width=".5"/>
      <circle cx="88" cy="72" r="1.3" fill="#fff2b2" stroke="#b8862f" stroke-width=".5"/>
      <circle cx="105" cy="110" r="1.3" fill="#fff2b2" stroke="#b8862f" stroke-width=".5"/>
      <circle cx="118" cy="137" r="1.3" fill="#fff2b2" stroke="#b8862f" stroke-width=".5"/>
    </g>

    <g id="hangers" stroke="#8feeF5" stroke-width=".8" opacity=".9">
      <path d="M63 103L63 141.5M73 83L73 147M86 70L86 154.5M99 83L99 161M108 102L108 166"/>
      <path d="M57 111L57 139M70 94L70 145M83 80L83 152M96 88L96 158M109 109L109 166"/>
    </g>

    <g id="arch-leds" fill="none">
      <path d="M57 130.5C66 76 100 48 119 161.5" stroke="#7ff0f8" stroke-width="1.5" stroke-dasharray="1.2 7" opacity=".95"/>
      <path d="M41 138.5C50 84 84 56 103 169.5" stroke="#7ff0f8" stroke-width="1.5" stroke-dasharray="1.2 7" opacity=".95"/>
      <path d="M84.3 83V76" stroke="#b8862f" stroke-width="1.4"/>
      <circle cx="84.3" cy="73.5" r="3" fill="rgba(255,233,161,.35)"/>
      <circle cx="84.3" cy="73.5" r="1.6" fill="#ffe9a1" stroke="#b8862f" stroke-width=".6"/>
    </g>

    <path d="M57 130.5L41 138.5" stroke="#223247" stroke-width="2"/>
    <path d="M103 169.5L119 161.5" stroke="#223247" stroke-width="2"/>
  </g>

  <g id="futuristic-car">
    <g transform="translate(80 150) rotate(26.57)">
      <ellipse cx="0" cy="3" rx="9" ry="2" fill="#223247" opacity=".3"/>
      <path d="M-8 0C-8 -3 -5 -5 0 -5C6 -5 9 -3 9 0C9 2 5 3 0 3C-5 3 -8 2 -8 0Z" fill="#f9fdff" stroke="#223247" stroke-width=".9"/>
      <path d="M-5 -3L0 -4L5 -3L4 0L-4 0Z" fill="url(#brGlass)" stroke="#223247" stroke-width=".5"/>
      <path d="M-7 1L7 1" stroke="#5de6f2" stroke-width=".8"/>
      <circle cx="6" cy="0" r=".9" fill="#fff3b8"/>
    </g>
  </g>

  <g id="bridge-detail">
    <path d="M47 142L44 146L40 144L43 140Z" fill="#8fd06a" stroke="#223247" stroke-width=".5"/>
    <path d="M113 160L116 156L120 158L117 162Z" fill="#57b765" stroke="#223247" stroke-width=".5"/>
    <path d="M50 132L54 130L56 131L52 133Z" fill="url(#brGold)" stroke="#8a641d" stroke-width=".4"/>
    <path d="M106 168L110 166L112 167L108 169Z" fill="url(#brGold)" stroke="#8a641d" stroke-width=".4"/>
    <path d="M34 149C40 146 46 147 52 144" fill="none" stroke="#d7fbff" stroke-width=".8" opacity=".55"/>
    <circle cx="96" cy="145" r="2" fill="none" stroke="#d7fbff" stroke-width=".6" opacity=".55"/>
    <circle cx="66" cy="136" r="1.4" fill="none" stroke="#fff" stroke-width=".5" opacity=".55"/>
  </g>
</svg>
