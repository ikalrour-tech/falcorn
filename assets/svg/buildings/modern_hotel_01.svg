<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240" width="160" height="240" role="img" aria-labelledby="htTitle htDesc">
  <title id="htTitle">Hotel Bintang Laut — hotel mewah lengkung</title>
  <desc id="htDesc">Hotel berbentuk layar dengan balkon putih, kaca cyan, aksen emas, kolam, air mancur, dan pohon palem. Digambar isometrik 2:1.</desc>

  <defs>
    <linearGradient id="htCream" x1="0" y1="0" x2="1" y2=".35">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset=".55" stop-color="#f5ead1"/>
      <stop offset="1" stop-color="#dcc9a5"/>
    </linearGradient>
    <linearGradient id="htCreamShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="1" stop-color="#e9d9b8"/>
    </linearGradient>
    <linearGradient id="htGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5f4fb"/>
      <stop offset=".4" stop-color="#43c8df"/>
      <stop offset=".78" stop-color="#1682ab"/>
      <stop offset="1" stop-color="#0b587c"/>
    </linearGradient>
    <linearGradient id="htGlassEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#147699"/>
      <stop offset="1" stop-color="#79e6f2"/>
    </linearGradient>
    <linearGradient id="htStoneLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d3c6ab"/>
      <stop offset="1" stop-color="#f1e7d1"/>
    </linearGradient>
    <linearGradient id="htStoneRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff9e9"/>
      <stop offset="1" stop-color="#e2d3b3"/>
    </linearGradient>
    <linearGradient id="htGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b0"/>
      <stop offset=".5" stop-color="#e9c46a"/>
      <stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
    <linearGradient id="htWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aef6ff"/>
      <stop offset=".5" stop-color="#43c1dd"/>
      <stop offset="1" stop-color="#1f81a9"/>
    </linearGradient>
    <radialGradient id="htShadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#18332a" stop-opacity=".3"/>
      <stop offset="1" stop-color="#18332a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="htBeacon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff8c4"/>
      <stop offset=".4" stop-color="#ffd76a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="htCreamClip">
      <path d="M36 198C22 146 34 86 70 42C58 102 88 168 80 216Z"/>
    </clipPath>
    <clipPath id="htGlassClip">
      <path d="M80 216C88 168 58 102 70 42C96 78 118 136 124 198Z"/>
    </clipPath>

    <pattern id="htGlassFloors" width="9" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 5L9 0" stroke="#ecffff" stroke-width=".65" opacity=".5"/>
    </pattern>

    <g id="htPalm">
      <path d="M0 0C-2 -8 -1 -16 0 -24" fill="none" stroke="#8a5a2b" stroke-width="2.6" stroke-linecap="round"/>
      <g stroke="#223247" stroke-width=".65">
        <path d="M0 -24C-12 -32 -20 -28 -25 -22C-14 -25 -7 -22 0 -21Z" fill="#3f9b4f"/>
        <path d="M0 -24C-10 -36 -18 -38 -24 -36C-13 -33 -7 -27 0 -22Z" fill="#57b765"/>
        <path d="M0 -24C10 -36 18 -37 24 -34C13 -31 7 -26 0 -22Z" fill="#3f9b4f"/>
        <path d="M0 -24C12 -28 20 -26 25 -20C14 -22 7 -21 0 -21Z" fill="#4daa5b"/>
        <path d="M0 -24C2 -34 0 -40 -3 -45C-5 -36 -4 -29 0 -22Z" fill="#57b765"/>
      </g>
      <circle cx="0" cy="-24" r="2" fill="#c9a227" stroke="#223247" stroke-width=".6"/>
    </g>
  </defs>

  <g id="shadow">
    <ellipse cx="84" cy="217" rx="60" ry="21" fill="url(#htShadow)"/>
    <path d="M80 189L144 218L80 238L16 208Z" fill="#173b2c" opacity=".1"/>
