    <ellipse cx="109" cy="221" rx="12" ry="5" fill="#c7f8ff" opacity=".7"/>
    <path d="M109 220C106 214 109 208 113 205C113 212 112 216 109 220Z" fill="#d7fbff" opacity=".9"/>
    <ellipse cx="109" cy="224" rx="3.5" ry="1.5" fill="#fff" opacity=".65"/>
    <use href="#htPalm" transform="translate(28 210) scale(.98)"/>
    <use href="#htPalm" transform="translate(133 203) scale(.8)"/>
    <use href="#htPalm" transform="translate(22 218) scale(.6)"/>
  </g>

  <g id="podium" stroke="#223247" stroke-width="1.7" stroke-linejoin="round">
    <polygon points="30,196 80,221 80,233 30,208" fill="url(#htStoneLeft)"/>
    <polygon points="80,221 130,196 130,208 80,233" fill="url(#htStoneRight)"/>
    <polygon points="80,171 130,196 80,221 30,196" fill="#fffaee"/>
    <path d="M30 196L80 221L130 196" fill="none" stroke="url(#htGold)" stroke-width="2.2"/>
    <path d="M32 207L80 231L128 207" fill="none" stroke="#c9a227" stroke-width="1.1" opacity=".8"/>
    <path d="M76 209C84 205 99 202 106 206L101 217C94 213 84 215 79 221Z" fill="#12435f"/>
    <path d="M79 210L101 200L107 205L85 216Z" fill="url(#htGold)" stroke="#8a641d" stroke-width="1"/>
    <path d="M84 212L94 207L94 219L84 224Z" fill="#5ddbe9" opacity=".75"/>
    <path d="M82 168L96 175L80 183L66 175Z" fill="#e9c46a" stroke="#8a641d" stroke-width=".8"/>
    <path d="M38 201L48 196L48 204L38 209Z" fill="#7fe7f4" opacity=".8"/>
    <path d="M112 200L122 195L122 202L112 207Z" fill="#7fe7f4" opacity=".8"/>
    <path d="M119 191L130 185" fill="none" stroke="#fff8e8" stroke-width="2"/>
  </g>

