  <g id="glints" fill="#ffffff" opacity=".65">
    <rect x="88" y="120" width="5" height="2" transform="rotate(-38 88 120)"/>
    <rect x="97" y="143" width="4" height="2" transform="rotate(-38 97 143)"/>
    <rect x="74" y="80" width="4" height="2" transform="rotate(-42 74 80)"/>
  </g>
</svg>
