      <path d="M70 42V22" stroke="#b8862f" stroke-width="2"/>
      <path d="M70 42V22" stroke="#ffe9a1" stroke-width=".8"/>
      <circle cx="70" cy="20" r="9" fill="url(#htBeacon)" opacity=".85"/>
      <circle cx="70" cy="20" r="2.2" fill="#fff8c4" stroke="#b8862f" stroke-width=".8"/>
      <path d="M60 50C66 45 74 44 80 46C72 48 66 52 62 57Z" fill="#fffdf3" stroke="#223247" stroke-width=".8"/>
      <path d="M62 54C68 50 75 50 80 52" fill="none" stroke="#e9c46a" stroke-width=".9"/>
      <path d="M64 58L76 53L74 58L66 62Z" fill="#55cfe3" opacity=".8" stroke="#223247" stroke-width=".6"/>
