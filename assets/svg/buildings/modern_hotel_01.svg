      <path d="M36 198C22 146 34 86 70 42" stroke="#fffdf3" stroke-width="1.1"/>
      <path d="M70 42C58 102 88 168 80 216" stroke="#223247" stroke-width="2.6"/>
      <path d="M70 42C58 102 88 168 80 216" stroke="url(#htGold)" stroke-width="1.6"/>
