      <path d="M16 166C50 182 92 168 120 140" fill="none" stroke="#fffef8" stroke-width="2"/>
      <path d="M16 150C52 168 94 154 118 126" fill="none" stroke="#fffef8" stroke-width="2"/>
      <path d="M18 134C54 152 94 140 114 112" fill="none" stroke="#fffef8" stroke-width="2"/>
      <path d="M22 118C56 136 92 126 112 98" fill="none" stroke="#fffef8" stroke-width="2"/>
      <path d="M28 102C58 118 90 108 108 82" fill="none" stroke="#fffef8" stroke-width="2"/>
      <path d="M34 86C60 100 86 94 102 68" fill="none" stroke="#fffef8" stroke-width="1.7"/>
      <path d="M42 72C62 82 82 78 94 58" fill="none" stroke="#fffef8" stroke-width="1.5"/>

      <path d="M40 174C56 180 72 176 88 166L88 170C72 180 54 184 40 178Z" fill="#55cfe3" opacity=".9"/>
      <path d="M44 158C60 164 74 160 90 150L90 154C74 164 58 168 44 162Z" fill="#55cfe3" opacity=".82"/>
      <path d="M48 142C62 148 76 144 90 134L90 138C76 148 62 152 48 146Z" fill="#55cfe3" opacity=".72"/>
      <path d="M52 126C64 132 76 128 88 118L88 122C76 132 64 136 52 130Z" fill="#55cfe3" opacity=".64"/>
      <path d="M56 110C66 115 76 112 86 104L86 108C76 116 66 119 56 114Z" fill="#55cfe3" opacity=".56"/>
      <path d="M60 94C68 98 76 96 84 90L84 94C76 100 68 102 60 98Z" fill="#55cfe3" opacity=".46"/>

      <g stroke="#f0dca9" stroke-width=".7" opacity=".9">
        <path d="M42 174L42 178M52 176L52 180M62 175L62 179M72 172L72 176M82 168L82 172"/>
        <path d="M46 158L46 162M56 160L56 164M66 159L66 163M76 155L76 159M86 151L86 155"/>
        <path d="M50 142L50 146M60 144L60 148M70 143L70 147M80 139L80 143"/>
      </g>

      <path d="M30 196C40 154 40 96 70 44L78 48C54 104 52 158 48 192Z" fill="#ffffff" opacity=".25"/>
    </g>

    <g clip-path="url(#htGlassClip)">
