<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240" width="160" height="240" role="img" aria-labelledby="gpTitle gpDesc">
  <title id="gpTitle">Istana Pemerintahan — gedung pemerintahan megah</title>
  <desc id="gpDesc">Istana batu putih dengan kubah emas, serambi berkolom, sayap kaca, taman, air mancur, dan pohon palem. Digambar isometrik 2:1.</desc>

