    <path d="M58 204L70 198L82 204L70 210Z" fill="#e05a2b"/>
    <path d="M70 210L82 204L82 211L70 217Z" fill="#b84420"/>
    <path d="M58 204L70 210L70 217L58 211Z" fill="#e05a2b"/>
    <path d="M70 198L82 204L82 211L70 205Z" fill="#f0703f" opacity=".8"/>
    <path d="M52 204L64 198L76 204L64 210Z" fill="#e9c46a"/>
    <path d="M64 210L76 204L76 211L64 217Z" fill="#c9a53f"/>
    <path d="M52 204L64 210L64 217L52 211Z" fill="#e9c46a"/>
