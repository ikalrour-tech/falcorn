  <g id="containers" stroke="#223247" stroke-width=".8">
    <path d="M46 212L58 206L70 212L58 218Z" fill="#2a9d8f"/>
    <path d="M58 218L70 212L70 219L58 225Z" fill="#1d7a70"/>
    <path d="M46 212L58 218L58 225L46 219Z" fill="#2a9d8f"/>
