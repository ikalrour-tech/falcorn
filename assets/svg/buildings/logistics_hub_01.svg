  <g id="yard-detail">
    <path d="M86 222L100 215L106 218L92 225Z" fill="#f0d060" stroke="#223247" stroke-width=".5" opacity=".7"/>
    <path d="M96 226L108 220L112 222L100 228Z" fill="#8fd06a" opacity=".6"/>
