    <path d="M126 199V158" stroke="#b8862f" stroke-width="2.6"/>
    <path d="M106 166L130 156" stroke="#e9c46a" stroke-width="4"/>
    <path d="M106 166L130 156" stroke="#fff3b8" stroke-width="1.2"/>
    <path d="M120 159V183" stroke="#223247" stroke-width=".9"/>
    <path d="M116 183L124 183L122 188L118 188Z" fill="#e9c46a" stroke="#223247" stroke-width=".8"/>
    <path d="M112 206L128 198" stroke="#223247" stroke-width="1"/>
    <path d="M130 156L136 160" stroke="#e9c46a" stroke-width="2"/>
