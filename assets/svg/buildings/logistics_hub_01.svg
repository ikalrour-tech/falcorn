  </g>

  <g id="delivery-truck">
    <path d="M34 216L58 204L70 210L46 222Z" fill="#f6f9fc" stroke="#223247" stroke-width=".9"/>
    <path d="M46 222L70 210L70 217L46 229Z" fill="#d5dce4" stroke="#223247" stroke-width=".9"/>
    <path d="M58 204L66 200L78 206L70 210Z" fill="#e05a2b" stroke="#223247" stroke-width=".9"/>
    <path d="M64 206L70 203L76 206" fill="none" stroke="#5bdbe9" stroke-width="1.2"/>
    <circle cx="43" cy="223" r="2.2" fill="#223247"/>
    <circle cx="63" cy="214" r="2.2" fill="#223247"/>
    <circle cx="68" cy="219" r="2.2" fill="#223247"/>
