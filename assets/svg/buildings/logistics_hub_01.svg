<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240" width="160" height="240" role="img" aria-labelledby="lgTitle lgDesc">
  <title id="lgTitle">Pusat Logistik Nusantara</title>
  <desc id="lgDesc">Gudang logistik modern dengan dermaga muat, tumpukan kontainer warna, derek gantry, truk, atap skylight, dan pohon palem.</desc>

  <defs>
    <linearGradient id="lgWallLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8c0ca"/>
      <stop offset="1" stop-color="#e7edf3"/>
    </linearGradient>
    <linearGradient id="lgWallRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbfcfe"/>
      <stop offset="1" stop-color="#ccd5df"/>
    </linearGradient>
    <linearGradient id="lgRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e0e8"/>
    </linearGradient>
    <linearGradient id="lgGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#145f7e"/>
      <stop offset=".55" stop-color="#2e9bb6"/>
      <stop offset="1" stop-color="#8ce8f1"/>
    </linearGradient>
    <linearGradient id="lgGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2b2"/>
      <stop offset=".5" stop-color="#e9c46a"/>
      <stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
    <linearGradient id="lgAsphalt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4cad2"/>
      <stop offset="1" stop-color="#a8b0ba"/>
    </linearGradient>
    <radialGradient id="lgShadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#18332a" stop-opacity=".28"/>
      <stop offset="1" stop-color="#18332a" stop-opacity="0"/>
    </radialGradient>
    <g id="lgPalm">
      <path d="M0 0C-2 -8 -1 -16 0 -24" fill="none" stroke="#8a5a2b" stroke-width="2.6" stroke-linecap="round"/>
      <g stroke="#223247" stroke-width=".65">
        <path d="M0 -24C-12 -32 -20 -28 -25 -22C-14 -25 -7 -22 0 -21Z" fill="#3f9b4f"/>
        <path d="M0 -24C-10 -36 -18 -38 -24 -36C-13 -33 -7 -27 0 -22Z" fill="#57b765"/>
        <path d="M0 -24C10 -36 18 -37 24 -34C13 -31 7 -26 0 -22Z" fill="#3f9b4f"/>
        <path d="M0 -24C12 -28 20 -26 25 -20C14 -22 7 -21 0 -21Z" fill="#4daa5b"/>
        <path d="M0 -24C2 -34 0 -40 -3 -45C-5 -36 -4 -29 0 -22Z" fill="#57b765"/>
      </g>
      <circle cx="0" cy="-24" r="2" fill="#c9a227" stroke="#223247" stroke-width=".6"/>
    </g>
  </defs>

  <g id="shadow">
    <ellipse cx="84" cy="219" rx="63" ry="21" fill="url(#lgShadow)"/>
    <path d="M80 190L146 219L80 238L14 209Z" fill="#173b2c" opacity=".1"/>
  </g>

  <g id="logistics-yard">
    <path d="M80 183L135 208L80 234L25 208Z" fill="url(#lgAsphalt)" stroke="#8e97a3" stroke-width="1.2"/>
    <path d="M80 190L127 208L80 228L33 208Z" fill="none" stroke="#f0d060" stroke-width="1" stroke-dasharray="5 5" opacity=".7"/>
    <use href="#lgPalm" transform="translate(31 210) scale(.8)"/>
    <use href="#lgPalm" transform="translate(132 203) scale(.7)"/>
  </g>

  <g id="warehouse" stroke="#223247" stroke-width="1.8" stroke-linejoin="round">
    <polygon points="40,190 80,210 80,228 40,208" fill="url(#lgWallLeft)"/>
    <polygon points="80,210 120,190 120,208 80,228" fill="url(#lgWallRight)"/>
    <polygon points="80,168 120,188 80,208 40,188" fill="url(#lgRoof)"/>
    <polygon points="80,170 114,187 80,204 46,187" fill="#f8fbfd" opacity=".9"/>
