      <stop offset="0" stop-color="#a6df7c"/>
      <stop offset=".55" stop-color="#8fd06a"/>
      <stop offset="1" stop-color="#74bb52"/>
    </linearGradient>
    <linearGradient id="pkPath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3e8cd"/>
      <stop offset="1" stop-color="#d9c7a2"/>
    </linearGradient>
    <linearGradient id="pkWasser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9f8ff"/>
      <stop offset=".55" stop-color="#54c7e0"/>
      <stop offset="1" stop-color="#2487ac"/>
    </linearGradient>
    <linearGradient id="pkRoof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ed3e2"/>
      <stop offset=".6" stop-color="#2a9d9b"/>
      <stop offset="1" stop-color="#1d6f75"/>
