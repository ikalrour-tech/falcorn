    <linearGradient id="pkGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2b2"/>
      <stop offset=".5" stop-color="#e9c46a"/>
      <stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
    <clipPath id="pkClip"><path d="M80 89L142 120L80 151L18 120Z"/></clipPath>
