<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-labelledby="pkTitle pkDesc">
  <title id="pkTitle">Taman Kota Nusantara</title>
  <desc id="pkDesc">Taman isometrik dengan jalur batu, air mancur, gazebo, kolam kecil, bunga, bangku, lampu taman, dan pohon palem.</desc>

  <defs>
